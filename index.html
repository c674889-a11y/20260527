<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME-X // 科技明亮風動漫資料庫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo" onclick="switchPage('home')">Anime-X //</div>
        <button class="nav-btn" onclick="switchPage('add-page')">+ 新增動漫數據</button>
    </header>

    <div class="container">
        
        <div id="home" class="page active">
            <div class="anime-grid" id="animeGrid">
                </div>
        </div>

        <div id="detail-page" class="page">
            <button class="nav-btn nav-btn-secondary" onclick="switchPage('home')" style="margin-bottom: 24px;">← 返回大廳</button>
            <div class="detail-wrapper" id="detailWrapper">
                </div>
        </div>

        <div id="add-page" class="page">
            <div class="form-box">
                <h2>// INPUT ANIME DATA</h2>
                <form id="animeForm">
                    <div class="form-group">
                        <label>動漫作品名稱</label>
                        <input type="text" id="titleInput" class="form-control" placeholder="請輸入動漫標題..." required>
                    </div>
                    <div class="form-group">
                        <label>劇情簡介介紹</label>
                        <textarea id="plotInput" class="form-control" rows="6" placeholder="請輸入詳細的精采劇情簡介..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>上傳動漫封面</label>
                        <input type="file" id="coverInput" class="form-control" accept="image/*" required>
                    </div>
                    <button type="submit" class="submit-btn">同步至資料庫 // SUBMIT</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        // 1. 初始化預設實驗數據
        const defaultAnimes = [
            {
                id: 1,
                title: "Cyberpunk: Edgerunners",
                plot: "講述一名街頭浪子試圖在迷戀科技和身體改造的未來城市中生存下來。在失去了一切之後，他選擇成為一名邊緣行者（Edgerunners）——一種法外狂徒的雇傭兵，以此維持生計。",
                cover: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600",
                rating: 4.8,
                ratingCount: 1
            },
            {
                id: 2,
                title: "進擊的巨人 (Attack on Titan)",
                plot: "百年前世界莫名出現神秘的巨人怪物，不斷殘忍食人，人類幾乎慘遭滅絕。倖存的人類建造了三道巨大防護牆來阻止巨人的入侵，並享受了一百年的和平。直到那一天，超大型巨人打破了牆壁...",
                cover: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600",
                rating: 4.9,
                ratingCount: 1
            }
        ];

        // 2. 資料庫讀取 (檢測 localStorage)
        let animeDatabase = JSON.parse(localStorage.getItem('animeData_v2')) || defaultAnimes;
        let currentAnimeId = null;

        // 3. 視窗分頁切換控制
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
            
            if(pageId === 'home') {
                renderAnimeList();
            }
        }

        // 4. 渲染首頁卡片矩陣
        function renderAnimeList() {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';

            animeDatabase.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => openDetailPage(anime.id);
                
                card.innerHTML = `
                    <img class="anime-cover" src="${anime.cover}" alt="${anime.title}" loading="lazy">
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <div class="anime-rating-tag">★ ${anime.rating.toFixed(1)}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 5. 載入並產生單獨的「動漫獨立頁面」
        function openDetailPage(id) {
            currentAnimeId = id;
            const anime = animeDatabase.find(a => a.id === id);
            const wrapper = document.getElementById('detailWrapper');
            
            wrapper.innerHTML = `
                <div>
                    <img class="detail-cover" src="${anime.cover}" alt="${anime.title}">
                </div>
                <div class="detail-content">
                    <h2>${anime.title}</h2>
                    <div style="margin-bottom: 24px;">
                        <span class="anime-rating-tag" style="font-size: 16px; padding: 6px 12px;">
                            目前數據：★ <span id="avgRating">${anime.rating.toFixed(1)}</span> (${anime.ratingCount} 次評分)
                        </span>
                    </div>
                    <h3 class="plot-title">// 劇情簡介 DESCRIPTION</h3>
                    <div class="plot-box">
                        ${anime.plot.replace(/\n/g, '<br>')}
                    </div>
                    
                    <div class="rating-section">
                        <h3>// 評分此部動畫 DATA FEEDBACK</h3>
                        <div class="stars" id="starContainer">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <p class="rating-status" id="ratingStatus">系統就緒。請點選上方星星欄位進行實時評分...</p>
                    </div>
                </div>
            `;
            
            bindRatingEvents();
            switchPage('detail-page');
        }

        // 6. 互動式即時評分演算法邏輯
        function bindRatingEvents() {
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                // 滑鼠移入與移出動態視覺回饋
                star.onmouseover = function() {
                    const val = parseInt(this.getAttribute('data-value'));
                    stars.forEach(s => {
                        if(parseInt(s.getAttribute('data-value')) <= val) s.classList.add('active');
                    });
                };
                
                star.onmouseout = function() {
                    stars.forEach(s => s.classList.remove('active'));
                };

                // 點擊即時結算分數
                star.onclick = function() {
                    const userRating = parseInt(this.getAttribute('data-value'));
                    const anime = animeDatabase.find(a => a.id === currentAnimeId);
                    
                    // 動態權重公式計算
                    let totalScore = (anime.rating * anime.ratingCount) + userRating;
                    anime.ratingCount += 1;
                    anime.rating = totalScore / anime.ratingCount;
                    
                    // 寫入本地存儲空間
                    localStorage.setItem('animeData_v2', JSON.stringify(animeDatabase));
                    
                    // 即時刷新 UI 數據
                    document.getElementById('avgRating').innerText = anime.rating.toFixed(1);
                    document.getElementById('ratingStatus').innerText = `傳輸成功！您已成功提交 ${userRating} 星評分！`;
                    
                    // 鎖定高亮該分數
                    stars.forEach(s => {
                        s.onmouseover = null;
                        s.onmouseout = null;
                        if(parseInt(s.getAttribute('data-value')) <= userRating) {
                            s.classList.add('active');
                        } else {
                            s.classList.remove('active');
                        }
                    });
                };
            });
        }

        // 7. 新增動漫表單與封面圖片轉化 (FileReader Base64 技術)
        document.getElementById('animeForm').onsubmit = function(e) {
            e.preventDefault();
            
            const title = document.getElementById('titleInput').value;
            const plot = document.getElementById('plotInput').value;
            const fileInput = document.getElementById('coverInput');
            const file = fileInput.files[0];
            
            const reader = new FileReader();
            
            reader.onloadend = function() {
                const base64Cover = reader.result; // 將上傳的本機封面圖片轉化為資料庫可存字串
                
                const newAnime = {
                    id: Date.now(), // 毫秒時間戳記作為唯一識別碼
                    title: title,
                    plot: plot,
                    cover: base64Cover,
                    rating: 0.0,
                    ratingCount: 0
                };
                
                animeDatabase.push(newAnime);
                localStorage.setItem('animeData_v2', JSON.stringify(animeDatabase));
                
                // 表單重設、提示並跳轉回大廳
                document.getElementById('animeForm').reset();
                alert("【系統提示】全新動漫數據及封面已同步至瀏覽器核心。");
                switchPage('home');
            };
            
            if (file) {
                reader.readAsDataURL(file);
            }
        };

        // 8. 網頁初始啟動序列
        renderAnimeList();
    </script>
</body>
</html>
