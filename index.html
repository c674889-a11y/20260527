<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIME-X // 科技明亮風動漫資料庫 V3</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 為新增的「多維度評分」與「刪除功能」追加的科技感樣式 */
        .rating-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            border-left: 3px solid var(--neon-blue);
        }
        .rating-label {
            font-weight: bold;
            font-size: 15px;
            color: var(--text-main);
            letter-spacing: 1px;
        }
        .sub-stars {
            display: flex;
            gap: 8px;
        }
        .sub-star {
            font-size: 28px;
            cursor: pointer;
            color: #cbd5e1;
            transition: transform 0.1s, color 0.2s;
        }
        .sub-star:hover {
            transform: scale(1.15);
        }
        .sub-star.active {
            color: #ffb703;
            text-shadow: 0 0 8px rgba(255, 183, 3, 0.5);
        }
        .tech-score-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 12px;
            margin-bottom: 20px;
        }
        .score-block {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0,0,0,0.05);
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .score-block strong {
            display: block;
            font-size: 18px;
            color: var(--text-main);
            font-family: monospace;
            margin-top: 4px;
        }
        .delete-container {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed rgba(255, 0, 127, 0.2);
            display: flex;
            justify-content: flex-end;
        }
        .delete-btn {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 10px 20px;
            border-radius: var(--radius-tech);
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.1);
        }
        .delete-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 18px var(--neon-pink);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchPage('home')">Anime-X //</div>
        <button class="nav-btn" onclick="switchPage('add-page')">+ 新增動漫數據</button>
    </header>

    <div class="container">
        
        <div id="home" class="page active">
            <div class="anime-grid" id="animeGrid">
                </div>
        </div>

        <div id="detail-page" class="page">
            <button class="nav-btn nav-btn-secondary" onclick="switchPage('home')" style="margin-bottom: 24px;">← 返回大廳</button>
            <div class="detail-wrapper" id="detailWrapper">
                </div>
        </div>

        <div id="add-page" class="page">
            <div class="form-box">
                <h2>// INPUT ANIME DATA</h2>
                <form id="animeForm">
                    <div class="form-group">
                        <label>動漫作品名稱</label>
                        <input type="text" id="titleInput" class="form-control" placeholder="請輸入動漫標題..." required>
                    </div>
                    <div class="form-group">
                        <label>劇情簡介介紹</label>
                        <textarea id="plotInput" class="form-control" rows="6" placeholder="請輸入詳細的精采劇情簡介..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>上傳動漫封面</label>
                        <input type="file" id="coverInput" class="form-control" accept="image/*" required>
                    </div>
                    <button type="submit" class="submit-btn">同步至資料庫 // SUBMIT</button>
                </form>
            </div>
        </div>

    </div>
